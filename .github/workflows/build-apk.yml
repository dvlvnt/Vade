name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları kur ve web uygulamasını derle
        run: |
          npm install
          npm run build

      - name: Android projesini oluştur
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Bildirim simgesi ve kesin zamanlı alarm izni
        run: |
          cp -r res/* android/app/src/main/res/
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Sabit imza anahtarını kullan
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: APK derle
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK dosyasını hazırla
        run: cp android/app/build/outputs/apk/debug/app-debug.apk vade.apk

      - name: Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Vade APK (son sürüm)
          files: vade.apk
          make_latest: true
